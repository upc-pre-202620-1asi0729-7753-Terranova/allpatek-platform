spring.application.name=Allpatek Platform
spring.profiles.default=dev
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.naming.physical-strategy=com.allpatekplatform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
documentation.application.description=@project.description@
documentation.application.version=@project.version@
authorization.jwt.secret=AllpatekLocalDevJwtSecretKeyThatIsLongEnoughForHs256
authorization.jwt.expiration.days=7
weather.open-meteo.base-url=https://api.open-meteo.com/v1/forecast
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.threads.virtual.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui/index.html
