spring.application.name=Allpatek Platform
spring.profiles.default=dev
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.naming.physical-strategy=com.allpatekplatform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
documentation.application.description=@project.description@
documentation.application.version=@project.version@
weather.open-meteo.base-url=https://api.open-meteo.com/v1/forecast
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.threads.virtual.enabled=true
